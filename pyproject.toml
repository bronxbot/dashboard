[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "bronxbot-dashboard"
version = "1.0.0"
description = "BronxBot Discord Bot Dashboard"
authors = ["BronxBot Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
flask = "3.0.0"
werkzeug = "3.0.6"
click = "8.1.7"
itsdangerous = "2.1.2"
jinja2 = "3.1.6"
markupsafe = "2.1.5"
gunicorn = "23.0.0"
requests = "2.32.2"
pymongo = "4.6.3"
motor = "3.3.2"
sqlalchemy = "2.0.25"
aiosqlite = "0.19.0"
flask-login = "0.5.0"
Flask-SQLAlchemy = "2.5.1"
python-dotenv = "1.0.0"
